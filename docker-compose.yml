services:
  faultlens-sample-webapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    # Configuration comes from your local .env file (copy .env.example -> .env).
    # No source edits required.
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
